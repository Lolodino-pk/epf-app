name : "TP2"
on :
  push : 
    branches :
      - main
    path-ignore:
      - '*.md'
  pull-request :
    path-ignore:
      - '*.md'
  workflow_dispatch :

jobs :
  lint :
    runs-on: ubuntu-latest
    steps :
      - uses : actions/checkout@v4
      - uses : actions/setup-node@v7
        with:
          node-version : 20
          cache :'npm'
      - run : npm ci
      - run : npm run lint

  test : 
    runs-on : ubuntu-latest
    strategy:
      matrix:
        nod: [20.22]
    steps:
      - uses: actions/checkout@v4
      - uses : actions/setup-node@v7
        with:
          node-version : ${{ matrix.node }}
          cache :'npm'
      - run : npm ci
      - run : npm run test

  build :
    runs-on: ubuntu-latest
    needs : [lint,test]
    steps :
      - uses : actions/checkout@v4
      - run : npm ci
      - run : npm run build
      - run: du -sh dist >> $GITHUB_STEP_SUMMARY
