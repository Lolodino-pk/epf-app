name : "TP2"

on :
  push : 
    branches :
      - main
    path-ignore:
      - '*.md'
  pull_request :
    path-ignore:
      - '*.md'
  workflow_dispatch :

concurrency : 
  group: "${{ github.workflow }}-${{github.ref }}"
  cancel-in-progress: false

jobs :
  lint :
    runs-on: ubuntu-latest
    timeout-minutes : 10
    steps :
      - uses : actions/checkout@v4
      - uses : actions/setup-node@v7
        with:
          node-version : 20
          cache: 'npm'
      - run : npm ci
      - run : npm run lint
  test : 
    runs-on : ubuntu-latest
    timeout-minutes : 10
    strategy:
      matrix:
        nod: [20.22]
    steps:
      - uses: actions/checkout@v4
      - uses : actions/setup-node@v7
        with:
          node-version : ${{ matrix.node }}
          cache : 'npm
      - run : npm ci
      - run : npm run test

    build :
      runs-on: ubuntu-latest
      timeout-minutes : 10
      needs : [lint,test]
      steps :
        - uses : actions/checkout@v4
        - run : npm ci
        - run : npm run build
        - run: du -sh dist >> $GITHUB_STEP_SUMMARY
